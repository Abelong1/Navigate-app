<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FEFBE8" />
    <meta name="description" content="Study companion for CPE students: components, logic gates, number systems." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NaviGate" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>NaviGate</title>
      <style>
      /* Responsive: the app fills the screen on phones, centered column on larger screens */
      .ng-root { align-items: stretch !important; }
      .ng-frame {
        width: 100% !important; max-width: 760px;
        height: 100vh !important; height: 100dvh !important;
        border-radius: 0 !important; border: none !important; box-shadow: none !important;
        padding-top: env(safe-area-inset-top);
      }
      @media (min-width: 761px) {
        .ng-frame { border-left: 1px solid #FFE988 !important; border-right: 1px solid #FFE988 !important; }
      }
      @media (min-width: 600px) {
        .ng-modgrid { grid-template-columns: repeat(4, 1fr) !important; }
      }
      img, svg { max-width: 100%; }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
